name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PttDictation.sln --locked-mode

      - name: Audit NuGet packages
        run: dotnet list PttDictation.sln package --vulnerable --include-transitive

      - name: Test
        run: dotnet test PttDictation.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src\PttDictation.App\PttDictation.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish\ptt-dictation-win-x64

      - name: Verify bundled runtime security baseline
        shell: pwsh
        run: |
          $coreLibrary = Get-Item publish\ptt-dictation-win-x64\System.Private.CoreLib.dll
          $runtimeVersion = [Version]($coreLibrary.VersionInfo.ProductVersion.Split('-')[0])
          $minimumVersion = [Version]'10.0.11'
          if ($runtimeVersion -lt $minimumVersion) {
            throw "Published runtime $runtimeVersion is older than the required security baseline $minimumVersion."
          }
          Write-Host "Published runtime $runtimeVersion meets the security baseline."

      - name: Restore locked SBOM tool
        run: dotnet tool restore

      - name: Generate SBOM
        shell: pwsh
        run: |
          dotnet tool run dotnet-CycloneDX PttDictation.sln -o publish -fn PttDictation.cdx.json -F Json -t --set-name PttDictation --set-version $env:GITHUB_REF_NAME

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish\ptt-dictation-win-x64\* -DestinationPath publish\PttDictation-win-x64.zip -Force
          $hash = (Get-FileHash publish\PttDictation-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PttDictation-win-x64.zip" | Set-Content -NoNewline -Encoding ascii publish\PttDictation-win-x64.zip.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PttDictation-win-x64
          path: |
            publish/PttDictation-win-x64.zip
            publish/PttDictation-win-x64.zip.sha256
            publish/PttDictation.cdx.json

      - name: Attest release artifact
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: publish/PttDictation-win-x64.zip

  publish:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PttDictation-win-x64
          path: publish

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            publish\PttDictation-win-x64.zip `
            publish\PttDictation-win-x64.zip.sha256 `
            publish\PttDictation.cdx.json `
            --draft `
            --repo $env:GITHUB_REPOSITORY `
            --title $env:GITHUB_REF_NAME `
            --notes "See README.md and SECURITY.md for privacy, verification, and third-party runtime/model asset notes."
