name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PttDictation.sln --locked-mode

      - name: Audit NuGet packages
        run: dotnet list PttDictation.sln package --vulnerable --include-transitive

      - name: Restore standalone diagnostic tools
        shell: pwsh
        run: |
          dotnet restore tools/PttDictation.Capture/PttDictation.Capture.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tools/PttDictation.Replay/PttDictation.Replay.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      browser-needed: ${{ steps.changes.outputs.browser-needed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Identify documentation-only pull requests
        id: changes
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $needed = $true
          # A later push can cancel an earlier app-change run. Always validate
          # the latest branch head; only cumulative PR diffs may skip browsers.
          if ($env:EVENT_NAME -eq 'pull_request' -and $env:BASE_SHA -match '^[0-9a-f]{40}$') {
            $paths = @(git diff --name-only "$($env:BASE_SHA)...$($env:HEAD_SHA)")
            if ($LASTEXITCODE -ne 0) { throw 'Cannot determine changed files.' }
            $needed = @($paths | Where-Object { $_ -notmatch '(^docs/|\.md$|^LICENSE$)' }).Count -gt 0
          }
          "browser-needed=$($needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PttDictation.sln --locked-mode

      - name: Test
        # This opt-in is limited to the disposable GitHub-hosted Windows runner.
        env:
          PTT_RUN_VISIBLE_UI_TESTS: '1'
        run: dotnet test PttDictation.sln --configuration Release --no-restore --filter "TestCategory!=FirefoxColdStart&TestCategory!=ChromeColdStart"

      - name: Test permanent local deployment workflow
        shell: pwsh
        run: ./scripts/Test-LocalAppDeployment.ps1

      - name: Test public release installer
        shell: powershell
        run: ./scripts/Test-ReleaseInstaller.ps1

      - name: Test Qwen registration workflow
        shell: pwsh
        run: ./scripts/Test-QwenInstallation.ps1

      - name: Test resident Qwen worker
        run: python -B -m unittest discover -s tools/qwen-worker -p test_qwen_worker.py -v

  firefox-cold-start:
    name: Firefox cold start
    needs: test
    if: needs.test.outputs.browser-needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PttDictation.sln --locked-mode

      - name: Test real Firefox from fresh processes and profiles
        shell: pwsh
        run: ./scripts/Test-FirefoxColdStart.ps1

      - name: Upload Firefox cold-start evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-cold-start-evidence-${{ github.run_attempt }}
          path: artifacts/firefox-cold-start/
          if-no-files-found: warn
          retention-days: 14

      - name: Analyze Firefox failure dumps
        if: always()
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/Analyze-FirefoxFailure.ps1

      - name: Upload Firefox native stacks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-native-stacks-${{ github.run_attempt }}
          path: |
            artifacts/firefox-cold-start/**/*.stacks.txt
            artifacts/firefox-cold-start/**/*.debugger-errors.txt
          if-no-files-found: ignore
          retention-days: 14

  chrome-cold-start:
    name: Chrome cold start
    needs: test
    if: needs.test.outputs.browser-needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PttDictation.sln --locked-mode

      - name: Test real Chrome from fresh processes and profiles
        shell: pwsh
        run: ./scripts/Test-ChromeColdStart.ps1

      - name: Upload Chrome cold-start evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-cold-start-evidence-${{ github.run_attempt }}
          path: artifacts/chrome-cold-start/
          if-no-files-found: warn
          retention-days: 14
