name: Firefox lock investigation

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/firefox-lock-investigation.yml
      - tests/PttDictation.Tests/FirefoxSlowCallCollector.cs
      - tests/PttDictation.Tests/FirefoxWaitChainWorker.ps1
      - scripts/Analyze-FirefoxFailure.ps1

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'investigate/firefox-live-lock'
    name: Firefox live capture ${{ matrix.sample }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PttDictation.sln --locked-mode
      - name: Prepare native debugger before browser launch
        shell: pwsh
        run: ./scripts/Analyze-FirefoxFailure.ps1 -PrepareOnly
      - name: Exercise fresh Firefox with prepared live collector
        shell: pwsh
        env:
          PTT_CAPTURE_SLOW_FIREFOX: '1'
        run: ./scripts/Test-FirefoxColdStart.ps1
      - name: Preserve raw capture and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-lock-capture-${{ matrix.sample }}-${{ github.run_attempt }}
          path: artifacts/firefox-cold-start/
          if-no-files-found: warn
          retention-days: 14
      - name: Analyze paired native stacks and lock metadata
        if: always()
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/Analyze-FirefoxFailure.ps1
      - name: Preserve decoded native stacks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-lock-stacks-${{ matrix.sample }}-${{ github.run_attempt }}
          path: |
            artifacts/firefox-cold-start/**/*.stacks.txt
            artifacts/firefox-cold-start/**/*.debugger-errors.txt
          if-no-files-found: ignore
          retention-days: 14
